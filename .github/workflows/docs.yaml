name: docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build datasheet
        uses: TinyTapeout/tt-gds-action/docs@395eedb3eeec3c2f4961c3b04ff2cf87f5525636
        with:
          tools-ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8

      - name: Enforce documentation check result
        run: ./tt/tt_tool.py --check-docs
